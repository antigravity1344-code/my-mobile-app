name: Paksho integration checks

on:
  pull_request:
    branches:
      - ui/customer-home-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ui-and-server:
    name: Verify UI + server (no SMS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PAKSHO_SMS_MODE: fake
      PAKSHO_DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install app dependencies from lockfile
        run: npm ci
      - name: Install server dependencies from lockfile
        run: npm ci --prefix server
      - name: TypeScript type checking
        run: npm run typecheck
      - name: App unit tests
        run: npm test -- --reporter=dot
      - name: Server integration and regression tests (fake SMS)
        run: >
          node --test --test-concurrency=2
          server/accountFeatures.test.js
          server/cancelRequest.test.js
          server/orderEvents.test.js
          server/workerOrderPrivacy.test.js
          server/startIntegration.test.js

# Full browser-based admin tests require Playwright and are handled separately.
# This workflow does not build an Android APK or substitute for an on-device review.
