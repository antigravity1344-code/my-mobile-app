<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پاکشو — انتخاب برنامه</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Tahoma, sans-serif;
      background: #102b43;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box { width: min(420px, 92vw); text-align: center; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #f8d78b; font-size: 14px; line-height: 1.7; }
    a {
      display: block;
      margin: 14px 0 0;
      background: #087caf;
      color: #fff;
      text-decoration: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>پاکشو</h1>
    <p>نسخه آزمایشی | بدون پیامک واقعی و بدون پرداخت</p>
    <a href="/app.html?role=customer">برنامه مشتری</a>
    <a href="/app.html?role=worker">برنامه متخصص</a>
  </div>
</body>
</html>
